# nginx para servir el frontend compilado (SPA con react-router):
# cualquier ruta que no sea un archivo cae en index.html.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html SIEMPRE se revalida: sin esto el navegador le aplica caché
    # heurístico y sigue mostrando el bundle VIEJO después de cada despliegue
    # (el usuario veía fixes "que no funcionaban" hasta hacer Ctrl+Shift+R).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Cache larga para assets con hash en el nombre (cambia el hash → cambia la URL).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
