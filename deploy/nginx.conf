# nginx para servir el frontend compilado (SPA con react-router):
# cualquier ruta que no sea un archivo cae en index.html.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache larga para assets con hash en el nombre; index.html siempre fresco.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
